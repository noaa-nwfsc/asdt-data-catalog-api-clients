title = "ASDT Security & Leak Detection Configuration"

[extend]
useDefault = true # Automatically handles AWS, GCP, GitHub tokens, SSH keys, etc.

# ==============================================================================
# GLOBAL ALLOWLIST
# Prevents false positives from lockfiles and compiled binaries
# ==============================================================================
[allowlist]
description = "Ignore auto-generated lockfiles and build outputs"

paths = [
    '''yarn\.lock''',
    '''package-lock\.json''',
    '''pnpm-lock\.yaml''',
    '''uv\.lock''',
    '''Cargo\.lock''',
    '''\.jar$''',
    '''\.tar\.gz$''',
    '''\.whl$''',
    '''openapi/openapi-public\.json'''
]

regexes = [
    '''(?i)example[-_]?key''',
    '''(?i)mock[-_]?token''',
    '''00000000-0000-0000-0000-000000000000''',
    '''x-access-token:\$\{[a-zA-Z0-9_]+\}''', # Ignores https://x-access-token:${GH_TOKEN}@...
    '''://[^:\s]+:\$\{[a-zA-Z0-9_]+\}@'''     # Ignores any scheme://user:${ANY_ENV_VAR}@...
]

# ==============================================================================
# ABSTRACT CUSTOM RULES
# Catches credentials & internal IPs without revealing tech stack details.
# ==============================================================================

# 1. Generic Private IP Detection (RFC 1918)
[[rules]]
id = "internal-ip-address"
description = "Detects hardcoded private IPv4 addresses"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'''
keywords = ["10.", "172.", "192.168."]

[rules.allowlist]
regexes = ['''127\.0\.0\.1''', '''0\.0\.0\.0''']

# 2. Universal Connection String Credentials (DB Agnostic)
[[rules]]
id = "uri-embedded-credentials"
description = "Detects connection strings with embedded username/password"
regex = '''(?i)[a-z0-9+.-]+://[^:\s]+:[^@\s]+@[a-zA-Z0-9.-]+'''

# 3. URLs with Basic Auth Credentials
[[rules]]
id = "url-basic-auth"
description = "Detects HTTP/HTTPS URLs containing embedded authentication"
regex = '''(?i)https?://[^:\s]+:[^@\s]+@[a-zA-Z0-9.-]+'''