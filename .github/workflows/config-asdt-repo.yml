name: Configure Existing ASDT Repository
on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Name of an existing repository. 🛑 Do not include the org name (noaa-nwfsc). 🛡️ Workflow will abort of repository does not exist.'
        required: true
        type: string
      visibility:
        description: 'Repository visibility'
        required: true
        type: choice
        default: 'internal'
        options:
          - internal
          - private
          - public

jobs:
  build-and-configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Template Repository
        uses: actions/checkout@v4

      - name: Verify Secret Exists
        run: |
          if [ -z "${{ secrets.CREATE_FROM_TEMPLATE_APP_PAT }}" ]; then
            echo "::error::CREATE_FROM_TEMPLATE_APP_PAT is missing from the template repository secrets!"
            exit 1
          fi

      - name: Create and Configure New Repository from Template
        env:
          GH_TOKEN: ${{ secrets.CREATE_FROM_TEMPLATE_APP_PAT }}
          TEMPLATE_REPO: ${{ github.repository }}
          TARGET_REPO: ${{ github.repository_owner }}/${{ github.event.inputs.repo_name }}
        run: |
          # Copy the script to a safe location outside the git working tree
          TEMP=/tmp/asdt-config-repo.$$
          mkdir -p $TEMP
          cp .github/scripts/*.sh $TEMP
          chmod +x $TEMP/asdt-config-repo.sh
          
          # Run it from the temporary location
          $TEMP/asdt-config-repo.sh

      - name: Disable Factory Workflow in Target Repo
        env:
          GH_TOKEN: ${{ secrets.CREATE_FROM_TEMPLATE_APP_PAT }}
          TARGET_REPO: ${{ github.repository_owner }}/${{ github.event.inputs.repo_name }}
        run: |
          echo "Renaming factory workflow in child repository to .disabled..."
          git clone https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git child-repo
          cd child-repo
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f .github/workflows/create-new-asdt-repo.yml ]; then
            git mv .github/workflows/create-new-asdt-repo.yml .github/workflows/create-new-asdt-repo.yml.disabled
            git commit -m "chore: disable factory workflow in child repo [skip ci]"
            git push
          else
            echo "Workflow file not found in child repo. Skipping."
          fi
