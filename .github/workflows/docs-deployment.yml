# .github/workflows/docs-deployment.yml
name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - develop
      - "docs/**"
      - "build/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.2"

      - name: Install R Build Tools
        run: Rscript -e "install.packages(c('roxygen2', 'pkgdown'))"

      - name: Fetch OpenAPI Specs
        run: make fetch-public-spec

      - name: Generate API Clients
        run: make build-all

      - name: Bootstrap Python Client Virtual Environment
        run: |
          cd clients/python_public
          uv sync
          uv pip install sphinx pydata-sphinx-theme
          cd ../..

      - name: Run documentation builds
        run: |
          make docs-python
          make docs-r

      - name: Prepare Unified Site
        run: |
          mkdir -p _site
          mv docs/python _site/python
          mv clients/r_public/docs _site/r
          cp docs/index.html _site/index.html
          cp docs/data_rockfish_banner.png _site/data_rockfish_banner.png

      - name: Generate Redoc API Page
        run: |
          mkdir -p _site/api
          cp openapi/openapi-public.json _site/api/openapi.json
          cat <<EOF > _site/api/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <title>Redoc</title>
              <meta charset="utf-8"/>
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700" rel="stylesheet">
              <style>
                body {
                  margin: 0;
                  padding: 0;
                }
              </style>
            </head>
            <body>
              <redoc spec-url='openapi.json'></redoc>
              <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"> </script>
            </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
