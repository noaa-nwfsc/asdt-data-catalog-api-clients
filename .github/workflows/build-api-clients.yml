# .github/workflows/build-api-clients.yml
name: Build and Test API Clients

on:
  push:
    branches:
      - main
      - develop
      - "build/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write # Required for creating GitHub Releases

jobs:
  build-and-test:
    name: Build & Test Polyglot SDKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.2"

      - name: Install uv (Python Package Installer)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install R Dependencies
        run: |
          R -e "install.packages(c('roxygen2', 'pkgdown', 'httptest', 'testthat', 'dplyr', 'tibble', 'jsonlite'))"

      - name: Fetch OpenAPI Specification
        run: make fetch-public-spec

      - name: Build and Test Public Python Client
        run: make build-python-public

      - name: Build Public R Client
        run: make build-r-public

      # 1. Build WebR Binary
      - name: Build WebR Binary
        uses: r-wasm/actions/build-rwasm@v3
        with:
          packages: "./clients/r_public"
          repo-path: "webr_binaries"
        env:
          # Explicitly route to standard CRAN to fetch source packages for Wasm
          # This completely avoids the Posit Package Manager Linux binary metadata bug
          RSPM: "https://cloud.r-project.org"
          RENV_CONFIG_REPOS_OVERRIDE: "https://cloud.r-project.org"
          # Maintain standard runner environment variables
          UV_CACHE_DIR: /home/runner/work/_temp/setup-uv-cache
          R_LIBS_USER: /home/runner/work/_temp/Library
          TZ: UTC
          NOT_CRAN: true
          _R_CHECK_SYSTEM_CLOCK_: FALSE

      # 2. Build standard Tarball SECOND
      - name: Build R Tarball
        run: R CMD build clients/r_public

      - name: Upload WebR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webr-sdk-binary
          path: "webr_binaries/bin/emscripten/contrib/*/*.tgz"

      - name: Upload Python Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-wheel
          path: clients/python_public/dist/*.whl

      - name: Upload R Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-sdk-package
          path: nwfscDataCatalog_*.tar.gz

      # 3. Automated Release Management
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m 1 '^version =' clients/python_public/pyproject.toml | cut -d '"' -f 2)
          TAG="v$VERSION"

          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "Creating new release $TAG..."
            gh release create "$TAG" --title "Release $TAG" --notes "Automated release of API clients version $VERSION"
          else
            echo "Release $TAG already exists. Proceeding to asset upload."
          fi

          echo "Uploading assets to $TAG..."
          gh release upload "$TAG" clients/python_public/dist/*.whl *DataCatalog_*.tar.gz webr_binaries/bin/emscripten/contrib/*/*.tgz --clobber
